# Development override — hot-reload for both backend and frontend
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
services:

  backend:
    # Mount source code for live reload
    volumes:
      - ./backend:/app
      - energy_storage:/app/storage
    environment:
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    # Use Vite dev server instead of nginx in dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # anonymous volume so node_modules isn't overwritten by the mount
    environment:
      VITE_API_URL: "http://backend:8000"
    depends_on:
      - backend
